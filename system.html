<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เข้าสู่ระบบ — ระบบติดตามกีรออาตี โรงเรียนบาเจาะ</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root{
      --green: #0b6b3a;
      --light-green: #2fa36a;
      --gold: #c79a2f;
      --bg: #f6fff8;
      --text: #08321f;
    }
    html,body{height:100%;margin:0;font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;background:linear-gradient(180deg,var(--bg),#ecfff0);color:var(--text)}
    .container{min-height:100%;display:flex;align-items:center;justify-content:center;padding:2rem}
    .card{background:linear-gradient(180deg,rgba(255,255,255,0.95),rgba(250,250,250,0.95));border-radius:12px;box-shadow:0 8px 24px rgba(6,40,20,0.08);padding:2rem;max-width:420px;width:100%;border:3px solid rgba(199,154,47,0.08)}
    h1{margin:0 0 0.5rem;color:var(--green);font-size:1.5rem;text-align:center}
    .lead{margin:0 0 1rem;color:#0b3f28;text-align:center}
    form{display:flex;flex-direction:column;gap:0.75rem;margin-top:0.5rem}
    label{font-size:0.95rem;color:#0d3c27}
    input{width:100%;padding:0.6rem 0.75rem;border-radius:8px;border:1px solid #dfeee0;background:#fff}
    .actions{display:flex;gap:0.75rem;justify-content:center;margin-top:0.5rem}
    .btn{display:inline-block;padding:0.6rem 1rem;border-radius:8px;background:linear-gradient(90deg,var(--green),var(--light-green));color:white;text-decoration:none;font-weight:600;border:2px solid rgba(0,0,0,0.04)}
    .btn.secondary{background:transparent;color:var(--green);border:2px solid rgba(199,154,47,0.15)}
    .note{margin-top:0.75rem;font-size:0.9rem;color:#2e5b3f;text-align:center}
    @media (max-width:480px){.card{padding:1rem}}
  </style>
</head>
<body>
  <div class="container">
    <div class="card" role="main">
      <h1>เข้าสู่ระบบ</h1>
      <p class="lead">เข้าสู่ระบบเพื่อดูความก้าวหน้าและผลการเรียนของนักเรียน</p>
      <form id="loginForm" onsubmit="submitForm(event)">
        <label>
          ชื่อผู้ใช้งาน
          <input type="text" name="username" autocomplete="username" required>
        </label>
        <label>
          รหัสผ่าน
          <input type="password" name="password" autocomplete="current-password" required>
        </label>

        <div class="actions">
          <button class="btn" type="submit">เข้าสู่ระบบ</button>
          <a class="btn secondary" href="index.html">กลับสู่หน้าแรก</a>
        </div>
      </form>
      <p class="note">หมายเหตุ: หน้านี้เป็นตัวอย่างสำหรับดีโมเท่านั้น ไม่มีการเชื่อมต่อกับระบบจริง</p>
    </div>
  </div>

  <script>
    function submitForm(e){
      e.preventDefault();
      const u = document.querySelector('[name=username]').value.trim();
      if(!u){ alert('กรุณากรอกชื่อผู้ใช้งาน'); return; }
      // ตัวอย่างการตอบกลับแบบจำลอง
      alert('เข้าสู่ระบบสำเร็จ (จำลอง)\nผู้ใช้: ' + u);
      // ในการใช้งานจริง: ส่งข้อมูลไปยังเซิร์ฟเวอร์ด้วย fetch() หรือฟอร์มแบบปกติ
    }
  </script>
</body>
</html>
